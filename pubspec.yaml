
name: sv_vehicle_license_plate_detection
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  google_mlkit_text_recognition: ^0.13.0
  image: ^4.0.21
  flutter_slidable: ^3.1.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png.png"
  min_sdk_android: 21
